name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require release credentials
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in SIGNING_CERTIFICATE_BASE64 SIGNING_CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          release_keychain="$RUNNER_TEMP/tweaky-signing.keychain-db"
          release_keychain_password="$(uuidgen)"
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$release_keychain_password" "$release_keychain"
          security set-keychain-settings -lut 21600 "$release_keychain"
          security unlock-keychain -p "$release_keychain_password" "$release_keychain"
          security import "$certificate_path" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$release_keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$release_keychain_password" "$release_keychain"
          security list-keychain -d user -s "$release_keychain" login.keychain-db
          echo "RELEASE_KEYCHAIN=$release_keychain" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Package and sign application
        env:
          TWEAKY_SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: Scripts/package-app.sh release
      - name: Verify Developer ID signature
        run: codesign --verify --deep --strict --verbose=2 dist/Tweaky.app
      - name: Submit to Apple notarization service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Tweaky.app dist/Tweaky-notarization.zip
          xcrun notarytool submit dist/Tweaky-notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Tweaky.app
          xcrun stapler validate dist/Tweaky.app
      - name: Create release archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Tweaky.app dist/Tweaky.zip
          shasum -a 256 dist/Tweaky.zip > dist/Tweaky.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Tweaky.zip dist/Tweaky.zip.sha256 --generate-notes --verify-tag
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
