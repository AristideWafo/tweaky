name: CI

on:
  pull_request:
  push:
    branches: [main, master, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package application
        run: Scripts/package-app.sh release
      - name: Validate application metadata
        run: plutil -lint dist/Tweaky.app/Contents/Info.plist
      - name: Create development package
        run: ditto -c -k --sequesterRsrc --keepParent dist/Tweaky.app dist/Tweaky-development.zip
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tweaky-development-${{ github.sha }}
          path: dist/Tweaky-development.zip
          if-no-files-found: error
          retention-days: 14
